[project]
name = "streamdeck-component"
version = "0.1.0"
description = "Stream Deck profile slot copier and session monitor"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3.0",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["."]

