<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Antigravity Hub Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      color: #d8d8d8;
    }
    body {
      background-color: #2d2d2d;
      padding: 12px;
    }
    .sdpi-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sdpi-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sdpi-heading {
      font-weight: 600;
      font-size: 12px;
      color: #90caf9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #444;
      padding-bottom: 4px;
      margin-bottom: 4px;
    }
    .sdpi-label {
      font-weight: 500;
      color: #cccccc;
    }
    .sdpi-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="number"] {
      background-color: #3b3b3b;
      border: 1px solid #555555;
      color: #ffffff;
      padding: 6px 8px;
      border-radius: 4px;
      outline: none;
      width: 100px;
      font-size: 13px;
    }
    input[type="number"]:focus {
      border-color: #2979ff;
    }
    .sdpi-unit {
      color: #aaaaaa;
      font-size: 12px;
    }
    .sdpi-description {
      font-size: 11px;
      color: #888888;
      line-height: 1.4;
    }
    .sdpi-status {
      font-size: 11px;
      color: #43a047;
      min-height: 16px;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div class="sdpi-wrapper">
    <div class="sdpi-heading">Hub Settings</div>
    
    <div class="sdpi-item">
      <label class="sdpi-label" for="timeoutInput">Ready 待機時間 (完了から待機への遷移)</label>
      <div class="sdpi-input-row">
        <input type="number" id="timeoutInput" min="0" step="10" value="300" />
        <span class="sdpi-unit">秒</span>
      </div>
      <div class="sdpi-description">
        セッション完了 (DONE) 後、ハブの警告灯が待機 (READY) に戻るまでの時間を指定します。<br>
        (デフォルト: 300秒 / 5分)
      </div>
      <div id="statusMessage" class="sdpi-status"></div>
    </div>
  </div>

  <script>
    var websocket = null;
    var pluginUUID = null;
    var actionInfo = null;

    function connectElgatoStreamDeckSocket(inPort, inPluginUUID, inRegisterEvent, inInfo, inActionInfo) {
      pluginUUID = inPluginUUID;

      if (inActionInfo) {
        try {
          actionInfo = JSON.parse(inActionInfo);
          var settings = actionInfo.payload && actionInfo.payload.settings ? actionInfo.payload.settings : {};
          if (settings.hub_done_timeout_seconds !== undefined && settings.hub_done_timeout_seconds !== null) {
            document.getElementById("timeoutInput").value = settings.hub_done_timeout_seconds;
          }
        } catch (e) {
          console.error("Failed to parse actionInfo:", e);
        }
      }

      websocket = new WebSocket("ws://127.0.0.1:" + inPort);

      websocket.onopen = function () {
        var registerPayload = {
          event: inRegisterEvent,
          uuid: inPluginUUID
        };
        websocket.send(JSON.stringify(registerPayload));
      };

      websocket.onmessage = function (evt) {
        try {
          var jsonObj = JSON.parse(evt.data);
          if (jsonObj.event === "didReceiveSettings") {
            var newSettings = jsonObj.payload && jsonObj.payload.settings ? jsonObj.payload.settings : {};
            if (newSettings.hub_done_timeout_seconds !== undefined) {
              document.getElementById("timeoutInput").value = newSettings.hub_done_timeout_seconds;
            }
          }
        } catch (e) {
          console.error("Error processing websocket message:", e);
        }
      };
    }

    function saveSettings() {
      if (!websocket || websocket.readyState !== WebSocket.OPEN) {
        return;
      }
      var input = document.getElementById("timeoutInput");
      var val = parseFloat(input.value);
      if (isNaN(val) || val < 0) {
        val = 300;
        input.value = val;
      }

      var currentSettings = (actionInfo && actionInfo.payload && actionInfo.payload.settings) || {};
      currentSettings.hub_done_timeout_seconds = val;

      var json = {
        event: "setSettings",
        context: pluginUUID,
        payload: currentSettings
      };
      websocket.send(JSON.stringify(json));

      var statusElem = document.getElementById("statusMessage");
      if (statusElem) {
        statusElem.textContent = "設定を保存しました (" + val + " 秒)";
        setTimeout(function () {
          statusElem.textContent = "";
        }, 2000);
      }
    }

    document.getElementById("timeoutInput").addEventListener("change", saveSettings);
  </script>
</body>
</html>
