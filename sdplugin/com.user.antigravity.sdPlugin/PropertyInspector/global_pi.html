<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Antigravity Session Slot Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      color: #d8d8d8;
    }
    body {
      background-color: #2d2d2d;
      padding: 12px;
    }
    .sdpi-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .sdpi-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sdpi-heading {
      font-weight: 600;
      font-size: 12px;
      color: #90caf9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #444;
      padding-bottom: 4px;
    }
    .sdpi-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sdpi-label {
      font-weight: 500;
      color: #cccccc;
    }
    .sdpi-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select {
      background-color: #3b3b3b;
      border: 1px solid #555555;
      color: #ffffff;
      padding: 5px 8px;
      border-radius: 4px;
      outline: none;
      font-size: 12px;
      flex: 1;
      cursor: pointer;
    }
    select.order-select {
      flex: 0 0 90px;
    }
    select:focus {
      border-color: #2979ff;
    }
    .sdpi-description {
      font-size: 11px;
      color: #888888;
      line-height: 1.4;
    }
    .sdpi-status {
      font-size: 11px;
      color: #43a047;
      min-height: 16px;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div class="sdpi-wrapper">
    <div class="sdpi-section">
      <div class="sdpi-heading">セッションスロット一覧のソート設定</div>
      <div class="sdpi-description">
        Session 1〜5スロットおよびページ送り（全ブロック共通）で一覧表示するセッションの並び順を設定します。
      </div>

      <!-- 第1優先 -->
      <div class="sdpi-item">
        <label class="sdpi-label">第1優先キー</label>
        <div class="sdpi-input-row">
          <select id="field1">
            <option value="status">状態 (Waiting > Working > Done)</option>
            <option value="updated_at">最終更新日時</option>
            <option value="title">セッションタイトル</option>
          </select>
          <select id="order1" class="order-select">
            <option value="desc">降順 / 優先</option>
            <option value="asc">昇順 / 逆順</option>
          </select>
        </div>
      </div>

      <!-- 第2優先 -->
      <div class="sdpi-item">
        <label class="sdpi-label">第2優先キー (同率時のタイブレーク)</label>
        <div class="sdpi-input-row">
          <select id="field2">
            <option value="updated_at">最終更新日時</option>
            <option value="status">状態 (Waiting > Working > Done)</option>
            <option value="title">セッションタイトル</option>
          </select>
          <select id="order2" class="order-select">
            <option value="desc">降順 / 新しい順</option>
            <option value="asc">昇順 / 古い順</option>
          </select>
        </div>
      </div>

      <!-- 第3優先 -->
      <div class="sdpi-item">
        <label class="sdpi-label">第3優先キー</label>
        <div class="sdpi-input-row">
          <select id="field3">
            <option value="title">セッションタイトル</option>
            <option value="updated_at">最終更新日時</option>
            <option value="status">状態 (Waiting > Working > Done)</option>
          </select>
          <select id="order3" class="order-select">
            <option value="asc">昇順 (A-Z / 五十音)</option>
            <option value="desc">降順 (Z-A)</option>
          </select>
        </div>
      </div>

      <div id="statusMessage" class="sdpi-status"></div>
    </div>
  </div>

  <script>
    var websocket = null;
    var pluginUUID = null;

    function applySortCriteriaToUI(criteria) {
      if (!Array.isArray(criteria) || criteria.length === 0) return;
      if (criteria[0]) {
        document.getElementById("field1").value = criteria[0].field;
        document.getElementById("order1").value = criteria[0].ascending ? "asc" : "desc";
      }
      if (criteria[1]) {
        document.getElementById("field2").value = criteria[1].field;
        document.getElementById("order2").value = criteria[1].ascending ? "asc" : "desc";
      }
      if (criteria[2]) {
        document.getElementById("field3").value = criteria[2].field;
        document.getElementById("order3").value = criteria[2].ascending ? "asc" : "desc";
      }
    }

    function getSortCriteriaFromUI() {
      return [
        { field: document.getElementById("field1").value, ascending: document.getElementById("order1").value === "asc" },
        { field: document.getElementById("field2").value, ascending: document.getElementById("order2").value === "asc" },
        { field: document.getElementById("field3").value, ascending: document.getElementById("order3").value === "asc" }
      ];
    }

    function showStatus(msg) {
      var statusElem = document.getElementById("statusMessage");
      if (statusElem) {
        statusElem.textContent = msg;
        setTimeout(function () {
          statusElem.textContent = "";
        }, 2500);
      }
    }

    function connectElgatoStreamDeckSocket(inPort, inPluginUUID, inRegisterEvent, inInfo, inActionInfo) {
      pluginUUID = inPluginUUID;

      websocket = new WebSocket("ws://127.0.0.1:" + inPort);

      websocket.onopen = function () {
        var registerPayload = {
          event: inRegisterEvent,
          uuid: inPluginUUID
        };
        websocket.send(JSON.stringify(registerPayload));

        var getGlobalPayload = {
          event: "getGlobalSettings",
          context: inPluginUUID
        };
        websocket.send(JSON.stringify(getGlobalPayload));
      };

      websocket.onmessage = function (evt) {
        try {
          var jsonObj = JSON.parse(evt.data);
          if (jsonObj.event === "didReceiveGlobalSettings") {
            var gSettings = jsonObj.payload && jsonObj.payload.settings ? jsonObj.payload.settings : {};
            if (gSettings.sort_criteria) {
              applySortCriteriaToUI(gSettings.sort_criteria);
            }
          }
        } catch (e) {
          console.error("Error processing websocket message:", e);
        }
      };
    }

    function saveGlobalSettings() {
      if (!websocket || websocket.readyState !== WebSocket.OPEN) return;
      var criteria = getSortCriteriaFromUI();

      // Send to global settings
      websocket.send(JSON.stringify({
        event: "setGlobalSettings",
        context: pluginUUID,
        payload: { sort_criteria: criteria }
      }));

      showStatus("全スロット共通のソート設定を保存しました");
    }

    ["field1", "order1", "field2", "order2", "field3", "order3"].forEach(function(id) {
      document.getElementById(id).addEventListener("change", saveGlobalSettings);
    });
  </script>
</body>
</html>
